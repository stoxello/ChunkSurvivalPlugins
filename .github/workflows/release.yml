name: Plugin Release

on:
  push:
    tags:
      - "plugin-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Install .NET 9 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore ChunkSurvivalPlugins.sln

      - name: Build
        run: dotnet build ChunkSurvivalPlugins.sln --configuration Release --no-restore --nologo

      - name: Package plugins
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_VERSION -replace '^plugin-v', ''
          ./tools/package-all-plugins.ps1 `
            -Configuration Release `
            -ExpectedVersion $version `
            -NoBuild

      - name: Generate checksums
        working-directory: artifacts/plugins
        run: sha256sum *.zip > SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#plugin-v}"
          prerelease=""
          if [[ "${version}" == *-* ]]; then
            prerelease="--prerelease"
          fi
          gh release create "${GITHUB_REF_NAME}" \
            artifacts/plugins/*.zip \
            artifacts/plugins/SHA256SUMS.txt \
            --verify-tag \
            --generate-notes \
            --title "Chunk Survival Plugins ${GITHUB_REF_NAME}" \
            ${prerelease}
